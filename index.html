<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お茶みくじ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="期間限定お茶みくじは公開終了しました。不定期開催の予定です。最新情報は越智ゆえじオープンチャットでご案内しています。">
<meta property="og:type" content="website">
<meta property="og:title" content="お茶みくじ｜公開終了しました">
<meta property="og:description" content="ご好評ありがとうございました。期間限定お茶みくじは公開終了しました。不定期開催の予定なのでぜひお楽しみに！">
<meta property="og:image" content="https://kudo-nn.github.io/ochamikuji/ogp.png">
<meta property="og:url" content="https://kudo-nn.github.io/ochamikuji/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EFE4; --paper-2:#FBF8F1; --ink:#232A24; --ink-soft:#5C6259; --ink-faint:#8D9187;
  --tea-deep:#33503A; --shu:#C0503A; --gold:#B08A4A;
  --line:rgba(35,42,36,.14); --shadow:0 18px 46px -22px rgba(35,42,36,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16130F; --paper-2:#211C16; --ink:#EFE7D8; --ink-soft:#B6AC9B; --ink-faint:#8A8274;
    --tea-deep:#6D9375; --shu:#E0765D; --gold:#D0A863;
    --line:rgba(239,231,216,.16); --shadow:0 18px 46px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#16130F; --paper-2:#211C16; --ink:#EFE7D8; --ink-soft:#B6AC9B; --ink-faint:#8A8274;
  --tea-deep:#6D9375; --shu:#E0765D; --gold:#D0A863;
  --line:rgba(239,231,216,.16); --shadow:0 18px 46px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
  line-height:1.9; overflow-x:hidden;
  background-image:
    radial-gradient(circle at 18% 8%, rgba(176,138,74,.10), transparent 42%),
    radial-gradient(circle at 84% 78%, rgba(74,107,79,.10), transparent 46%);
  background-attachment:fixed;
  display:grid;place-items:center;padding:40px 16px;
}
.box{
  width:100%;max-width:440px;background:var(--paper-2);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);padding:44px 26px 40px;text-align:center;
  position:relative;overflow:hidden;
}
.box::before{
  content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:13px;pointer-events:none;
}
.cup{font-size:46px;line-height:1}
h1{
  font-family:"Shippori Mincho B1",serif;font-weight:600;
  font-size:clamp(26px,7.5vw,32px);letter-spacing:.14em;text-indent:.14em;margin-top:20px;
}
.rule{width:34px;height:1px;background:var(--line);margin:24px auto}
p{font-size:15px;color:var(--ink-soft);line-height:2.1;white-space:pre-line}
.oc-btn{
  display:inline-block;margin-top:30px;font-family:"Shippori Mincho B1",serif;font-size:14px;
  letter-spacing:.04em;color:var(--paper-2);background:var(--tea-deep);border-radius:999px;
  padding:15px 26px;text-decoration:none;white-space:nowrap;
  box-shadow:0 12px 24px -16px rgba(51,80,58,.9);
}
.oc-btn:active{transform:scale(.99)}
.note{display:block;font-size:11px;color:var(--ink-faint);margin-top:14px}
.sign{font-size:12px;color:var(--ink-faint);margin-top:30px;letter-spacing:.06em}
</style>
</head>
<body>
  <div class="box">
    <div class="cup">&#127861;</div>
    <h1>お茶みくじ</h1>
    <div class="rule"></div>
    <p>ご好評ありがとうございました
期間限定お茶みくじは公開終了しました

不定期開催の予定なので
ぜひお楽しみに！

最新情報は
越智ゆえじオープンチャットで
ご案内しています</p>
    <a class="oc-btn" href="https://line.me/ti/g2/ls117gJcdl8loBt1H410HK56HD-G6-2ACPkXgA" target="_blank" rel="noopener">ゆえじ茶の間オプチャをのぞいてみる</a>
    <span class="note">※日本国内のLINEのみ参加できます</span>
    <p class="sign">越智ゆえじ</p>
  </div>
</body>
</html>
